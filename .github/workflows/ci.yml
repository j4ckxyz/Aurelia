name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build for every platform, without cgo
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux go vet . && GOOS=linux go build ./...
          GOOS=windows go vet . && GOOS=windows go build ./...
          GOOS=darwin go vet . && GOOS=darwin go build ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test, on a session bus
        # What the desktop is told of the song playing goes over D-Bus:
        # the test needs a bus to tell.
        if: runner.os == 'Linux'
        env:
          AURELIA_REQUIRE_DBUS: "1"
        run: dbus-run-session -- go test ./...
      - name: Output devices, on a PulseAudio server
        # Sound is played on one of two sinks that make no noise, moved to
        # the other as it plays, and PulseAudio is asked where it is.
        if: runner.os == 'Linux'
        env:
          AURELIA_REQUIRE_PULSE: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=aurelia_a sink_properties=device.description=Aurelia_A
          pactl load-module module-null-sink sink_name=aurelia_b sink_properties=device.description=Aurelia_B
          pactl list sinks short
          go test ./internal/oto -run PulseDevices -v
      - name: The proxy's sandbox
        # It holds only in a build without cgo, as the proxy is built.
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          AURELIA_REQUIRE_SANDBOX: "1"
        run: go test ./tools/aurelia-proxy -run Sandbox -v
      - name: What the system is told plays
        shell: bash
        env:
          # Not skipped where the system has what they test.
          AURELIA_REQUIRE_DBUS: "1"
          AURELIA_REQUIRE_SMTC: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- go test . -run 'MPRIS|SystemMediaControls|TypedEventHandler' -v
          else
            go test . -run 'MPRIS|SystemMediaControls|TypedEventHandler' -v
          fi
