# Checks, on a real macOS, Windows and Linux, that an installed Aurelia
# replaces itself with a newer version, and that opened signed in it
# offers one, updates and reopens by itself: tools/update-test.sh.
name: Update test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.go
      - debug.go
      - tools/update-test.sh
      - go.mod
      - .github/workflows/update-test.yml

jobs:
  update:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Find NSIS, which makes the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files (x86)/NSIS" ]; then
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          else
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
      - name: A display, for the app to open its window on
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libgles2 libglx-mesa0 dbus-x11
      - name: Install an old version, publish a new one, and update
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- tools/update-test.sh
          else
            tools/update-test.sh
          fi
